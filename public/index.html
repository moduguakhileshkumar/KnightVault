<!-- ════════════════════════════════════
     JAVASCRIPT
════════════════════════════════════ -->
<script>
const API = '';
let currentCat  = 'all';
let currentPage = 1;
let searchQ     = '';
let searchTimer = null;
let currentWall = null;
let isAdmin     = false;
let adminPw     = '';
let adsenseId   = '';
let upTagsArr   = [];
let upCatsArr   = [];
let allTagsList = [];
let allCatsList = [];
let autoFocusIndex = -1;
let catAutoFocusIndex = -1;

async function loadAllTags() {
  try {
    const r = await fetch(`${API}/api/tags`);
    allTagsList = await r.json();
  } catch(e) {}
}

function renderCats() {
  const wrap = document.getElementById('upCatWrap');
  const input = document.getElementById('upCat');
  wrap.querySelectorAll('.tag-chip').forEach(el => el.remove());
  upCatsArr.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'tag-chip';
    chip.innerHTML = `${esc(cat)} <button type="button" onclick="removeCategory('${esc(cat)}'); event.stopPropagation();">✕</button>`;
    wrap.insertBefore(chip, input);
  });
}

function addCategory(cat) {
  cat = cat.trim().toLowerCase();
  if(!cat) return;
  if(!upCatsArr.includes(cat)) {
    upCatsArr.push(cat);
    if(!allCatsList.includes(cat)) allCatsList.push(cat);
    renderCats();
  }
  closeCatAutocomplete();
}

function removeCategory(cat) {
  upCatsArr = upCatsArr.filter(c => c !== cat);
  renderCats();
}

function renderTags() {
  const wrap = document.getElementById('upTagWrap');
  const input = document.getElementById('upTagInput');
  wrap.querySelectorAll('.tag-chip').forEach(el => el.remove());
  upTagsArr.forEach(tag => {
    const chip = document.createElement('div');
    chip.className = 'tag-chip';
    chip.innerHTML = `${esc(tag)} <button type="button" onclick="removeTag('${esc(tag)}'); event.stopPropagation();">✕</button>`;
    wrap.insertBefore(chip, input);
  });
}

function addTag(tag) {
  tag = tag.trim().toLowerCase();
  if(!tag) return;
  if(!upTagsArr.includes(tag)) {
    upTagsArr.push(tag);
    if(!allTagsList.includes(tag)) allTagsList.push(tag);
    renderTags();
  }
  closeAutocomplete();
}

function removeTag(tag) {
  upTagsArr = upTagsArr.filter(t => t !== tag);
  renderTags();
}

function showAutocomplete(e) {
  const input = e.target;
  const list = document.getElementById('upTagAuto');
  const val = input.value.trim().toLowerCase();
  
  autoFocusIndex = -1;
  list.innerHTML = '';
  
  if(!val) {
    list.style.display = 'none';
    return;
  }
  
  const matches = allTagsList.filter(t => t.includes(val) && !upTagsArr.includes(t)).slice(0, 8);
  
  let hasExact = false;
  
  matches.forEach((m) => {
    if(m === val) hasExact = true;
    const li = document.createElement('li');
    li.className = 'autocomplete-item';
    li.textContent = m;
    li.onmousedown = (ev) => { ev.preventDefault(); addTag(m); };
    list.appendChild(li);
  });
  
  if(!hasExact && !upTagsArr.includes(val)) {
    const li = document.createElement('li');
    li.className = 'autocomplete-item create';
    li.textContent = `Create "${val}"`;
    li.onmousedown = (ev) => { ev.preventDefault(); addTag(val); };
    list.appendChild(li);
  }
  
  list.style.display = 'block';
}

function handleTagKeydown(e) {
  const input = e.target;
  const list = document.getElementById('upTagAuto');
  const items = list.querySelectorAll('.autocomplete-item');
  
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if(items.length > 0) {
      autoFocusIndex = (autoFocusIndex + 1) % items.length;
      updateAutoActive(items);
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if(items.length > 0) {
      autoFocusIndex = (autoFocusIndex - 1 + items.length) % items.length;
      updateAutoActive(items);
    }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (autoFocusIndex >= 0 && autoFocusIndex < items.length) {
      items[autoFocusIndex].onmousedown(e);
    } else if (input.value.trim()) {
      addTag(input.value);
    }
  } else if (e.key === 'Backspace' && input.value === '') {
    if(upTagsArr.length > 0) {
      upTagsArr.pop();
      renderTags();
      closeAutocomplete();
    }
  } else if (e.key === 'Escape') {
    closeAutocomplete();
  }
}

function updateAutoActive(items) {
  items.forEach((item, i) => {
    if(i === autoFocusIndex) item.classList.add('active');
    else item.classList.remove('active');
  });
}

function closeAutocomplete() {
  const list = document.getElementById('upTagAuto');
  if (list) list.style.display = 'none';
  const input = document.getElementById('upTagInput');
  if (input) input.value = '';
}

function showCatAutocomplete(e) {
  const input = e.target;
  const list = document.getElementById('upCatAuto');
  const val = input.value.trim().toLowerCase();
  
  catAutoFocusIndex = -1;
  list.innerHTML = '';
  
  const matches = allCatsList.filter(c => c.includes(val)).slice(0, 8);
  let hasExact = false;
  
  matches.forEach((m) => {
    if(m === val) hasExact = true;
    const li = document.createElement('li');
    li.className = 'autocomplete-item';
    li.textContent = m;
    li.onmousedown = (ev) => { ev.preventDefault(); addCategory(m); };
    list.appendChild(li);
  });
  
  if(val && !hasExact) {
    const li = document.createElement('li');
    li.className = 'autocomplete-item create';
    li.textContent = `Create "${val}"`;
    li.onmousedown = (ev) => { ev.preventDefault(); addCategory(val); };
    list.appendChild(li);
  }
  
  if (matches.length > 0 || (val && !hasExact)) {
    list.style.display = 'block';
  } else {
    list.style.display = 'none';
  }
}

function handleCatKeydown(e) {
  const input = e.target;
  const list = document.getElementById('upCatAuto');
  const items = list.querySelectorAll('.autocomplete-item');
  
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if(items.length > 0) {
      catAutoFocusIndex = (catAutoFocusIndex + 1) % items.length;
      updateCatAutoActive(items);
    }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if(items.length > 0) {
      catAutoFocusIndex = (catAutoFocusIndex - 1 + items.length) % items.length;
      updateCatAutoActive(items);
    }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (catAutoFocusIndex >= 0 && catAutoFocusIndex < items.length) {
      items[catAutoFocusIndex].onmousedown(e);
    } else if (input.value.trim()) {
      addCategory(input.value);
    }
  } else if (e.key === 'Backspace' && input.value === '') {
    if(upCatsArr.length > 0) {
      upCatsArr.pop();
      renderCats();
      closeCatAutocomplete();
    }
  } else if (e.key === 'Escape') {
    closeCatAutocomplete();
  }
}

function updateCatAutoActive(items) {
  items.forEach((item, i) => {
    if(i === catAutoFocusIndex) item.classList.add('active');
    else item.classList.remove('active');
  });
}

function closeCatAutocomplete() {
  const list = document.getElementById('upCatAuto');
  if (list) list.style.display = 'none';
  const input = document.getElementById('upCat');
  if (input) input.value = '';
}

document.addEventListener('click', e => {
  if(!e.target.closest('#upTagWrap')) closeAutocomplete();
  if(!e.target.closest('#upCatWrap')) closeCatAutocomplete();
});

let secretBuffer = '';
const SECRET_PASSPHRASE = 'iambatman';
document.addEventListener('keydown', e => {
  if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
    secretBuffer += e.key.toLowerCase();
    if (secretBuffer.length > SECRET_PASSPHRASE.length) {
      secretBuffer = secretBuffer.slice(-SECRET_PASSPHRASE.length);
    }
    if (secretBuffer === SECRET_PASSPHRASE) {
      openLogin();
      secretBuffer = '';
    }
  }
});

/* ══════ INIT ══════ */
async function init() {
  try {
    const sr = await fetch(`${API}/api/settings`);
    const sd = await sr.json();
    if (sd) {
      if (sd.adsensePublisherId) {
        adsenseId = sd.adsensePublisherId;
        const script = document.createElement('script');
        script.async = true;
        script.src = `https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=${adsenseId}`;
        script.crossOrigin = 'anonymous';
        document.head.appendChild(script);
      }
      if (sd.googleAnalyticsId) {
        const gaId = sd.googleAnalyticsId;
        const s1 = document.createElement('script');
        s1.async = true;
        s1.src = `https://www.googletagmanager.com/gtag/js?id=${gaId}`;
        document.head.appendChild(s1);
        const s2 = document.createElement('script');
        s2.innerHTML = `window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','${gaId}');`;
        document.head.appendChild(s2);
      }
    }
  } catch(e) {}

  // Check if a password is even configured on the server
  try {
    const r = await fetch(`${API}/api/check-admin`);
    const d = await r.json();
    if (!d.passwordRequired) {
      // Dev mode — no password set, treat as admin
      setAdminMode(true, '');
    }
  } catch(e) {}

  await Promise.all([loadStats(), loadCategories(), loadAllTags()]);
  await loadWallpapers(1);
}

/* ══════ STATS (public) ══════ */
async function loadStats() {
  try {
    const r = await fetch(`${API}/api/stats`);
    const d = await r.json();
    document.getElementById('statTotal').innerHTML     = `<strong>${d.total}</strong> wallpapers`;
    document.getElementById('statDownloads').innerHTML = `<strong>${d.downloads}</strong> downloads`;
    document.getElementById('statViews').innerHTML     = `<strong>${d.views}</strong> views`;
  } catch(e) {}
}

/* ══════ CATEGORIES ══════ */
async function loadCategories() {
  try {
    const r    = await fetch(`${API}/api/categories`);
    const cats = await r.json();
    const bar  = document.getElementById('catBar');

    bar.querySelectorAll('.cat-pill:not(:first-child)').forEach(p => p.remove());

    allCatsList = cats.map(c => c.name);

    cats.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'cat-pill';
      btn.textContent = `${c.name} (${c.count})`;
      btn.onclick = () => selectCat(c.name, btn);
      bar.appendChild(btn);
    });
  } catch(e) {}
}

function selectCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  loadWallpapers(1);
}

/* ══════ WALLPAPERS ══════ */
async function loadWallpapers(page = 1) {
  currentPage = page;
  const sort  = document.getElementById('sortSelect').value;
  const grid  = document.getElementById('wallGrid');
  const pag   = document.getElementById('pagination');
  const count = document.getElementById('countInfo');

  grid.innerHTML = `<div style="grid-column:1/-1"><div class="state-msg"><div class="spinner"></div><p>Loading…</p></div></div>`;
  pag.innerHTML  = '';
  count.textContent = 'Loading…';

  const params = new URLSearchParams({ page, limit: 24, sort });
  if (currentCat !== 'all') params.set('category', currentCat);
  if (searchQ.trim())       params.set('q', searchQ.trim());

  try {
    const r = await fetch(`${API}/api/wallpapers?${params}`);
    const d = await r.json();
    renderGrid(d.wallpapers);
    renderPagination(d.page, d.pages);
    count.innerHTML = `<strong>${d.total}</strong> wallpaper${d.total !== 1 ? 's' : ''}`;
  } catch(e) {
    grid.innerHTML = `<div style="grid-column:1/-1"><div class="state-msg"><div class="icon">⚠</div><p>Could not connect to server</p></div></div>`;
  }
}

function renderGrid(walls) {
  const grid = document.getElementById('wallGrid');
  if (!walls || !walls.length) {
    grid.innerHTML = `<div style="grid-column:1/-1"><div class="state-msg"><div class="icon">🏰</div><p>No wallpapers found</p></div></div>`;
    return;
  }
  let html = '';
  walls.forEach((w, i) => {
    const pageLink = window.location.origin + '/w/' + w.filename.split('/').pop();
    html += `
    <div class="wall-card" onclick="window.location.href='${pageLink}'">
      <img src="${esc(w.directLink)}" alt="${esc(w.title)}" loading="lazy"
        onerror="this.style.opacity='0.3'" class="loading"
        onload="this.classList.remove('loading')">
      <div class="card-overlay">
        <div class="card-title">${esc(w.title)}</div>
        <div class="card-cats">
          ${(Array.isArray(w.category) ? w.category : [w.category]).filter(Boolean).map(c=>`<span class="card-cat-chip">${esc(c)}</span>`).join('')}
        </div>
        <div class="card-actions">
          <button class="card-btn card-btn-dl"
            onclick="event.stopPropagation();downloadWall('${w._id}','${esc(w.directLink)}','${esc(w.title)}')">
            ${w.isPaid ? `👑 PREMIUM $${w.price}` : '⬇ DOWNLOAD'}
          </button>
          ${isAdmin ? `<button class="card-btn card-btn-link" onclick="event.stopPropagation();copyText('${pageLink}','Page link copied!')">🔗</button>` : ''}
        </div>
      </div>
      ${w.tags && w.tags.length ? `<div class="card-badge">${esc(w.tags[0])}</div>` : ''}
      ${w.isPaid ? `<div class="card-badge" style="top:auto;bottom:8px;right:8px;background:rgba(201,168,76,0.9);color:#0A0A0F;border:none;">Premium $${w.price}</div>` : ''}
      ${isAdmin ? `<button class="card-del" onclick="event.stopPropagation();deleteWall('${w._id}','${esc(w.title)}')" title="Delete">✕</button>` : ''}
    </div>
  `;
    if (adsenseId && (i + 1) % 8 === 0) {
      html += `<div class="ad-slot"><ins class="adsbygoogle" style="display:block" data-ad-client="${adsenseId}" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle = window.adsbygoogle || []).push({});<\/script></div>`;
    }
  });
  grid.innerHTML = html;
}

function renderPagination(page, pages) {
  const pag = document.getElementById('pagination');
  if (pages <= 1) return;
  let html = '';
  if (page > 1) html += `<button class="page-btn" onclick="loadWallpapers(${page-1})">‹ Prev</button>`;
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i-page) <= 2)
      html += `<button class="page-btn ${i===page?'active':''}" onclick="loadWallpapers(${i})">${i}</button>`;
    else if (Math.abs(i-page) === 3)
      html += `<span style="color:var(--dim);padding:0 .3rem">…</span>`;
  }
  if (page < pages) html += `<button class="page-btn" onclick="loadWallpapers(${page+1})">Next ›</button>`;
  pag.innerHTML = html;
}

/* ══════ SEARCH ══════ */
function debounceSearch() {
  clearTimeout(searchTimer);
  searchQ = document.getElementById('searchInput').value;
  searchTimer = setTimeout(() => loadWallpapers(1), 380);
}

/* ══════ DOWNLOAD ══════ */
async function downloadWall(id, url, title) {
  try { await fetch(`${API}/api/wallpapers/${id}/download`, { method:'POST' }); } catch(e) {}
  window.location.href = `${API}/api/download-proxy?url=${encodeURIComponent(url)}&filename=${encodeURIComponent(title.replace(/\s+/g,'_'))}`;
  showToast('Downloading ' + title);
}

/* ══════ DELETE (admin) ══════ */
async function deleteWall(id, title) {
  if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
  try {
    const r = await fetch(`${API}/api/wallpapers/${id}`, {
      method: 'DELETE',
      headers: { 'x-admin-password': adminPw }
    });
    const d = await r.json();
    if (d.deleted) {
      showToast('Deleted: ' + title);
      loadWallpapers(currentPage);
      loadStats();
      loadCategories();
    } else {
      showToast('Delete failed: ' + (d.error || 'unknown'));
    }
  } catch(e) { showToast('Delete failed'); }
}

/* ══════ ADMIN LOGIN ══════ */
function openLogin()  { document.getElementById('loginModal').classList.add('open'); document.getElementById('pwInput').focus(); }
function closeLogin() { document.getElementById('loginModal').classList.remove('open'); document.getElementById('loginErr').textContent = ''; }

async function submitLogin() {
  const pw  = document.getElementById('pwInput').value;
  const btn = document.getElementById('loginSubmitBtn');
  const err = document.getElementById('loginErr');
  if (!pw) return err.textContent = 'Enter a password';

  btn.disabled = true;
  btn.textContent = 'Checking…';

  try {
    const r = await fetch(`${API}/api/verify-admin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const d = await r.json();
    if (d.ok) {
      adminPw = pw;
      setAdminMode(true, pw);
      closeLogin();
      showToast('Welcome, Vault Master');
    } else {
      err.textContent = 'Wrong password';
      btn.disabled = false;
      btn.textContent = '⚔ Enter Vault';
    }
  } catch(e) {
    err.textContent = 'Server error';
    btn.disabled = false;
    btn.textContent = '⚔ Enter Vault';
  }
}

function logout() {
  adminPw = '';
  setAdminMode(false);
  loadWallpapers(currentPage); // re-render to remove delete buttons
  showToast('Logged out');
}

function setAdminMode(on, pw) {
  isAdmin = on;
  if (pw !== undefined) adminPw = pw;

  // Show/hide UI elements based on admin state
  document.getElementById('uploadBtn-top').classList.toggle('hidden', !on);
  document.getElementById('adminBtn').classList.toggle('hidden', !on);
  document.getElementById('loginBtn').classList.toggle('hidden', on);
  document.getElementById('logoutBtn').classList.toggle('hidden', !on);
  document.getElementById('adminBar').classList.toggle('hidden', !on);
}

/* ══════ UPLOAD MODAL ══════ */
function openUpload()  {
  if (!isAdmin) { openLogin(); return; }
  document.getElementById('uploadModal').classList.add('open');
}
function closeUpload() {
  document.getElementById('uploadModal').classList.remove('open');
  document.getElementById('fileInput').value        = '';
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('previewImg').src         = '';
  document.getElementById('upTitle').value          = '';
  upCatsArr = [];
  renderCats();
  upTagsArr = [];
  renderTags();
  document.getElementById('upTagInput').value       = '';
  document.getElementById('uploadProg').style.display = 'none';
  document.getElementById('progBar').style.width    = '0%';
  document.getElementById('uploadSubmitBtn').disabled = false;
  document.getElementById('uploadSubmitBtn').textContent = '⚔ Upload to Vault';
}

function previewFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const img = document.getElementById('previewImg');
  img.src = URL.createObjectURL(file);
  img.style.display = 'block';
  if (!document.getElementById('upTitle').value)
    document.getElementById('upTitle').value = file.name.replace(/\.[^.]+$/, '').replace(/[_-]/g, ' ');
}

// Drag and drop
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', ()  => dz.classList.remove('drag'));
dz.addEventListener('drop',      e => {
  e.preventDefault(); dz.classList.remove('drag');
  const file = e.dataTransfer.files[0];
  if (file) {
    const dt = new DataTransfer();
    dt.items.add(file);
    document.getElementById('fileInput').files = dt.files;
    previewFile({ target: { files: [file] } });
  }
});

async function uploadWallpaper() {
  const file     = document.getElementById('fileInput').files[0];
  const title    = document.getElementById('upTitle').value.trim();
  const catInputStr = document.getElementById('upCat').value.trim();
  if (catInputStr) {
    catInputStr.split(',').forEach(c => {
      const cat = c.trim().toLowerCase();
      if (cat && !upCatsArr.includes(cat)) upCatsArr.push(cat);
    });
    document.getElementById('upCat').value = '';
    renderCats();
  }
  
  const tagInputStr = document.getElementById('upTagInput').value.trim();
  if (tagInputStr) {
    tagInputStr.split(',').forEach(t => {
      const tag = t.trim().toLowerCase();
      if (tag && !upTagsArr.includes(tag)) upTagsArr.push(tag);
    });
    document.getElementById('upTagInput').value = '';
    renderTags();
  }

  const category = upCatsArr.join(',');
  const tags     = upTagsArr.join(',');

  if (!file)     return showToast('Please select an image');
  if (!title)    return showToast('Please enter a title');
  if (!category) return showToast('Please add at least one category');

  const fd = new FormData();
  fd.append('image',    file);
  fd.append('title',    title);
  fd.append('category', category);
  fd.append('tags',     tags);

  document.getElementById('uploadSubmitBtn').disabled = true;
  document.getElementById('uploadSubmitBtn').textContent = 'Uploading…';
  document.getElementById('uploadProg').style.display = 'block';

  const xhr = new XMLHttpRequest();
  xhr.open('POST', `${API}/api/upload`);
  xhr.setRequestHeader('x-admin-password', adminPw);

  xhr.upload.onprogress = e => {
    if (e.lengthComputable) {
      const pct = Math.round(e.loaded / e.total * 100);
      document.getElementById('progBar').style.width   = pct + '%';
      document.getElementById('progText').textContent  = `Uploading to Cloudinary… ${pct}%`;
    }
  };

  xhr.onload = async () => {
    if (xhr.status === 201) {
      showToast('✓ Wallpaper live on Cloudinary!');
      closeUpload();
      await Promise.all([loadCategories(), loadStats()]);
      await loadWallpapers(1);
    } else if (xhr.status === 401) {
      showToast('Session expired — please log in again');
      logout();
      closeUpload();
    } else {
      try {
        const err = JSON.parse(xhr.responseText);
        showToast('Error: ' + (err.error || 'Unknown'));
      } catch(e) { 
        showToast('Upload failed: ' + xhr.responseText.substring(0, 40)); 
      }
      document.getElementById('uploadSubmitBtn').disabled = false;
      document.getElementById('uploadSubmitBtn').textContent = '⚔ Upload to Vault';
    }
  };

  xhr.onerror = () => {
    showToast('Network error');
    document.getElementById('uploadSubmitBtn').disabled = false;
  };

  xhr.send(fd);
}

/* ══════ UTILS ══════ */
function copyText(text, msg = 'Copied!') {
  navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); showToast(msg);
  });
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('uploadModal').classList.remove('open');
    document.getElementById('loginModal').classList.remove('open');
  }
});

/* ══════ BOOT ══════ */
init();
</script>
